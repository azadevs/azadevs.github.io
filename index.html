<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>azadevs apps</title>
<meta name="description" content="Apps by azadevs and their privacy policies.">
<style>
  :root { --bg: #f8faf5; --surface: #ffffff; --text: #191c19; --muted: #424940; --line: #dde5d9; --accent: #176b3d; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #101410; --surface: #181d18; --text: #e0e4dc; --muted: #c0c9bd; --line: #2c332b; --accent: #87d69b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 24px; margin: 0 0 24px; }
  .app { display: flex; align-items: center; gap: 16px; background: var(--surface);
    border: 1px solid var(--line); border-radius: 20px; padding: 16px; }
  .app img { width: 56px; height: 56px; border-radius: 16px; flex: none; }
  .app h2 { font-size: 18px; margin: 0; }
  .app p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
  .app + .app { margin-top: 12px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>azadevs</h1>
  <div class="app">
    <img src="pixreduce/icon-192.png" alt="">
    <div>
      <h2>PixReduce</h2>
      <p>Compress photos on your phone · <a href="pixreduce/privacy/">Privacy policy</a></p>
    </div>
  </div>
  <div class="app">
    <img src="pdfix/icon-192.png?v=2" alt="">
    <div>
      <h2>PDFix</h2>
      <p>Merge, split and compress PDFs offline · <a href="pdfix/privacy/">Privacy policy</a></p>
    </div>
  </div>
</main>
</body>
</html>
